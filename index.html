<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>eFOOTBALL · Temporada 7</title>
<meta name="description" content="Simulador mánager eFOOTBALL — Temporada 7. 6 mánagers, 0 KB de imágenes externas.">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<div id="app-grid">

  <!-- ============ COLUMNA IZQUIERDA — MENÚ eFOOTBALL ============ -->
  <nav id="nav-menu">
    <div class="brand">
      <span class="brand-mark">eFOOTBALL</span>
      <span class="brand-sub">Temp. 7</span>
    </div>

    <ul class="nav-list">
      <li><button class="nav-item active" data-view="inicio"><span class="nav-icon">🏠</span> Inicio</button></li>
      <li><button class="nav-item" data-view="equipos"><span class="nav-icon">👕</span> Equipos</button></li>
      <li><button class="nav-item" data-view="competiciones"><span class="nav-icon">🏆</span> Competiciones</button></li>
      <li><button class="nav-item" data-view="estadisticas"><span class="nav-icon">📊</span> Estadísticas</button></li>
      <li><button class="nav-item" data-view="estadios"><span class="nav-icon">🏟️</span> Estadios</button></li>
      <li><button class="nav-item" data-view="balones"><span class="nav-icon">⚽</span> Balones</button></li>
    </ul>

    <!-- Panel de control antiborrado (sin backend) — Fase 2 conecta la lógica -->
    <div class="control-panel">
      <div class="control-panel-title">Panel de control</div>
      <button class="btn-ghost" id="btn-exportar" disabled title="Disponible en la Fase 2">
        <span>💾</span> Exportar progreso
      </button>
      <button class="btn-ghost" id="btn-importar" disabled title="Disponible en la Fase 2">
        <span>📂</span> Importar progreso
      </button>
      <input type="file" id="input-importar" accept="application/json" class="visually-hidden">
      <p class="control-panel-hint">Copia de seguridad local en tu dispositivo — sin servidor, sin backend.</p>
    </div>
  </nav>

  <!-- ============ COLUMNA CENTRAL — SECCIÓN DINÁMICA ============ -->
  <main id="main-content">
    <h2 class="section-title">Selecciona tu caja</h2>

    <div class="team-select-grid" id="team-select-grid">

      <!-- Liverpool · Toñín -->
      <button class="team-box" data-team-id="liverpool" style="--primary:#c8102e; --secondary:#f6eb61;">
        <div class="team-box-inner">
          <div class="escudo escudo--rayas" style="--primary:#c8102e; --secondary:#f6eb61;">
            <span class="escudo-siglas">LIV</span>
          </div>
          <div class="team-box-meta">
            <span class="team-box-club">Liverpool</span>
            <span class="team-box-mister">Toñín</span>
            <span class="team-box-league">Liga EA Sports</span>
          </div>
        </div>
        <span class="team-box-cta">Entrar ▶</span>
      </button>

      <!-- Arsenal · Álvaro -->
      <button class="team-box" data-team-id="arsenal" style="--primary:#ef0107; --secondary:#063672;">
        <div class="team-box-inner">
          <div class="escudo escudo--rombo" style="--primary:#ef0107; --secondary:#063672;">
            <span class="escudo-siglas">ARS</span>
          </div>
          <div class="team-box-meta">
            <span class="team-box-club">Arsenal</span>
            <span class="team-box-mister">Álvaro</span>
            <span class="team-box-league">Liga EA Sports</span>
          </div>
        </div>
        <span class="team-box-cta">Entrar ▶</span>
      </button>

      <!-- Real Madrid · Acsa -->
      <button class="team-box" data-team-id="real-madrid" style="--primary:#febe10; --secondary:#112546;">
        <div class="team-box-inner">
          <div class="escudo escudo--rayas" style="--primary:#febe10; --secondary:#112546;">
            <span class="escudo-siglas">RMA</span>
          </div>
          <div class="team-box-meta">
            <span class="team-box-club">Real Madrid</span>
            <span class="team-box-mister">Acsa</span>
            <span class="team-box-league">Liga EA Sports</span>
          </div>
        </div>
        <span class="team-box-cta">Entrar ▶</span>
      </button>

      <!-- Atlético Madrid · Isra -->
      <button class="team-box" data-team-id="atletico-madrid" style="--primary:#cb3524; --secondary:#192c5b;">
        <div class="team-box-inner">
          <div class="escudo escudo--rombo" style="--primary:#cb3524; --secondary:#192c5b;">
            <span class="escudo-siglas">ATM</span>
          </div>
          <div class="team-box-meta">
            <span class="team-box-club">Atlético Madrid</span>
            <span class="team-box-mister">Isra</span>
            <span class="team-box-league">Liga EA Sports</span>
          </div>
        </div>
        <span class="team-box-cta">Entrar ▶</span>
      </button>

      <!-- FC Barcelona · Ángel -->
      <button class="team-box" data-team-id="fc-barcelona" style="--primary:#004d98; --secondary:#a50044;">
        <div class="team-box-inner">
          <div class="escudo escudo--rayas" style="--primary:#004d98; --secondary:#a50044;">
            <span class="escudo-siglas">FCB</span>
          </div>
          <div class="team-box-meta">
            <span class="team-box-club">FC Barcelona</span>
            <span class="team-box-mister">Ángel</span>
            <span class="team-box-league">Liga EA Sports</span>
          </div>
        </div>
        <span class="team-box-cta">Entrar ▶</span>
      </button>

      <!-- PSG · Izan -->
      <button class="team-box" data-team-id="psg" style="--primary:#0052b4; --secondary:#e30613;">
        <div class="team-box-inner">
          <div class="escudo escudo--rombo" style="--primary:#0052b4; --secondary:#e30613;">
            <span class="escudo-siglas">PSG</span>
          </div>
          <div class="team-box-meta">
            <span class="team-box-club">PSG</span>
            <span class="team-box-mister">Izan</span>
            <span class="team-box-league">Liga EA Sports</span>
          </div>
        </div>
        <span class="team-box-cta">Entrar ▶</span>
      </button>

    </div>
  </main>

  <!-- ============ COLUMNA DERECHA — CALENDARIO INDEPENDIENTE ============ -->
  <aside id="calendar-column">
    <div class="calendar-header">
      <span class="calendar-title">Calendario</span>
      <span class="calendar-badge" id="calendar-liga-badge">—</span>
    </div>

    <div id="calendar-content">
      <div class="calendar-empty" id="calendar-empty">
        <span class="calendar-empty-icon">🗓️</span>
        Selecciona una caja humana para ver su calendario de partidos.
      </div>
    </div>
  </aside>

</div>

<!-- ============ PANTALLA DE PREVIA — estadio · clima · balón (Fase 2) ============ -->
<div id="previa-overlay" class="previa-overlay" hidden>
  <div class="previa-card">
    <button type="button" class="previa-close" id="previa-close" aria-label="Cerrar previa">✕</button>

    <div class="previa-comp" id="previa-comp">—</div>

    <div class="previa-teams">
      <div class="previa-team" id="previa-team-local"></div>
      <div class="previa-marcador" id="previa-marcador">VS</div>
      <div class="previa-team" id="previa-team-visitante"></div>
    </div>

    <dl class="previa-info-grid">
      <div class="previa-info-item"><dt>🗓️ Fecha</dt><dd id="previa-fecha">—</dd></div>
      <div class="previa-info-item"><dt>🏟️ Estadio</dt><dd id="previa-estadio">—</dd></div>
      <div class="previa-info-item"><dt>🌦️ Clima</dt><dd id="previa-clima">—</dd></div>
      <div class="previa-info-item"><dt>⚽ Balón</dt><dd id="previa-balon">—</dd></div>
    </dl>
  </div>
</div>

<!-- Motor JS — Fase 2: lógica de estadios, clima y calendario ya implementada -->
<script src="js/renderizadores.js" defer></script>
<script src="js/estadios.js" defer></script>
<script src="js/balones.js" defer></script>
<script src="js/escudos.js" defer></script>
<script src="js/calendario.js" defer></script>
<script src="js/persistencia.js" defer></script>
<script src="js/main.js" defer></script>

</body>
</html>
