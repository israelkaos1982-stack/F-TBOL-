<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" role="img" aria-label="Paris Saint-Germain">

  <!-- ── OUTER RINGS ── -->
  <circle cx="256" cy="256" r="252" fill="#002B65"/>
  <circle cx="256" cy="256" r="247" fill="none" stroke="#FFFFFF" stroke-width="5"/>
  <!-- Red band: stroke centred at r=227, width 44 → spans r=205…249 -->
  <circle cx="256" cy="256" r="227" fill="none" stroke="#DA291C" stroke-width="44"/>
  <circle cx="256" cy="256" r="205" fill="none" stroke="#FFFFFF" stroke-width="5"/>
  <!-- Inner navy disc r=200 -->
  <circle cx="256" cy="256" r="200" fill="#002B65"/>

  <!-- ── ARC PATH defs ── -->
  <defs>
    <!-- Counter-clockwise arc from left through TOP to right, r=140
         Used for PARIS text sitting at the top of the inner disc -->
    <path id="psg-arc-top" d="M 116,256 A 140,140 0 0,0 396,256"/>
  </defs>

  <!-- PARIS (arc, top of inner disc) -->
  <text font-family="'Arial Black','Arial',Helvetica,sans-serif"
        font-size="50" font-weight="900" fill="#FFFFFF" letter-spacing="7">
    <textPath href="#psg-arc-top" xlink:href="#psg-arc-top" startOffset="50%" text-anchor="middle">PARIS</textPath>
  </text>

  <!-- SAINT-GERMAIN (straight, bottom of inner disc — avoids upside-down arc) -->
  <text x="256" y="418" text-anchor="middle"
        font-family="'Arial Black','Arial',Helvetica,sans-serif"
        font-size="24" font-weight="700" fill="#FFFFFF" letter-spacing="2">SAINT-GERMAIN</text>

  <!-- ── EIFFEL TOWER ── white silhouette, centre (256,265), h≈165px -->
  <g fill="#FFFFFF">
    <!-- Antenna -->
    <rect x="253" y="172" width="6" height="22" rx="2"/>
    <!-- Top peak -->
    <polygon points="256,192  247,213  265,213"/>
    <!-- Upper body -->
    <polygon points="247,213  236,251  276,251  265,213"/>
    <!-- Platform 1 -->
    <rect x="230" y="249" width="52" height="8" rx="2"/>
    <!-- Middle body -->
    <polygon points="236,257  219,296  293,296  276,257"/>
    <!-- Platform 2 -->
    <rect x="215" y="294" width="82" height="8" rx="2"/>
    <!-- Lower left arch leg -->
    <path d="M 219,302 Q 199,330 195,344 L 215,344 Q 217,331 231,314 Z"/>
    <!-- Lower right arch leg -->
    <path d="M 293,302 Q 313,330 317,344 L 297,344 Q 295,331 281,314 Z"/>
    <!-- Inner strut between legs -->
    <rect x="233" y="302" width="46" height="11" rx="2"/>
    <!-- Base platform -->
    <rect x="193" y="341" width="126" height="8" rx="2"/>
  </g>

  <!-- ── FLEUR-DE-LIS ── gold, below tower -->
  <g fill="#F4C542" transform="translate(256,392)">
    <!-- Central upward petal -->
    <path d="M 0,-28 C -9,-15 -9,1 0,14 C 9,1 9,-15 0,-28 Z"/>
    <!-- Tip accent -->
    <polygon points="0,-28  -5,-20  5,-20"/>
    <!-- Left spread petal -->
    <path d="M -1,-5 C -8,-15 -26,-13 -22,-1 C -18,7 -7,4 -1,1 Z"/>
    <!-- Right spread petal -->
    <path d="M 1,-5 C 8,-15 26,-13 22,-1 C 18,7 7,4 1,1 Z"/>
    <!-- Collar -->
    <rect x="-10" y="9" width="20" height="6" rx="3"/>
    <!-- Stem -->
    <rect x="-4" y="14" width="8" height="13" rx="2"/>
    <!-- Base bulb -->
    <ellipse cx="0" cy="29" rx="6" ry="4"/>
  </g>

</svg>
