<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
<!-- Paris Saint-Germain — escudo REAL redibujado a mano en vector puro
     (sin raster incrustado, ~1.7 KB: más ligero que cualquier PNG/JPG del
     escudo). Aro azul marino + disco blanco (con "PARIS" / "SAINT ·
     GERMAIN" en arco, en azul marino — antes iban en blanco directamente
     sobre el navy, sin el disco blanco que sí tiene el escudo real) +
     escudete rojo con borde azul marino (antes era un óvalo suelto) con
     la Torre Eiffel (en un rojo más oscuro, para el mismo efecto de
     relieve del escudo oficial) y la flor de lis dorada en la base. -->
<defs>
  <path id="psg-arc-top" d="M 28 100 A 72 72 0 0 1 172 100" fill="none"/>
  <path id="psg-arc-bottom" d="M 30 140 A 76 76 0 0 0 170 140" fill="none"/>
</defs>

<circle cx="100" cy="100" r="98" fill="#001e50"/>
<circle cx="100" cy="100" r="88" fill="#ffffff"/>

<!-- Escudete rojo (forma de blasón, no óvalo) -->
<path d="M 64 66 Q 64 56 100 56 Q 136 56 136 66 L 136 118 Q 136 150 100 162 Q 64 150 64 118 Z"
      fill="#e30613" stroke="#001e50" stroke-width="2.5"/>

<!-- Torre Eiffel simplificada, en un rojo más oscuro que da relieve -->
<g fill="#9c0f10">
  <polygon points="100,78 116,142 106,142 100,118 94,142 84,142"/>
  <rect x="90" y="104" width="20" height="3.5" rx="1"/>
  <rect x="94" y="90" width="12" height="3" rx="1"/>
</g>

<!-- Flor de lis dorada, en la base del escudete -->
<g fill="#c9a24b" transform="translate(82 136) scale(0.85)">
  <ellipse cx="0" cy="0" rx="5" ry="9" transform="rotate(-18)"/>
  <ellipse cx="0" cy="0" rx="5" ry="9" transform="rotate(18)"/>
  <ellipse cx="0" cy="-6" rx="4" ry="9"/>
  <rect x="-4" y="4" width="8" height="4" rx="1"/>
</g>

<text font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="800" fill="#001e50" letter-spacing="2">
  <textPath href="#psg-arc-top" startOffset="50%" text-anchor="middle">PARIS</textPath>
</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#001e50" letter-spacing="1.5">
  <textPath href="#psg-arc-bottom" startOffset="50%" text-anchor="middle">SAINT · GERMAIN</textPath>
</text>
</svg>
