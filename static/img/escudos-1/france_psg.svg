<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
<!-- Paris Saint-Germain — escudo simplificado, dibujado a mano en vector
     (0 KB de imagen externa: solo formas + texto, sin ningún raster
     incrustado). Círculo azul marino, óvalo rojo central con la Torre
     Eiffel + flor de lis en el mismo espíritu que el escudo real, y el
     texto "PARIS" / "SAINT-GERMAIN" en arco arriba y abajo. -->
<defs>
  <path id="psg-arc-top" d="M 24 100 A 76 76 0 0 1 176 100" fill="none"/>
  <path id="psg-arc-bottom" d="M 30 140 A 76 76 0 0 0 170 140" fill="none"/>
</defs>

<circle cx="100" cy="100" r="97" fill="#001e50"/>
<circle cx="100" cy="100" r="97" fill="none" stroke="#c9a24b" stroke-width="3"/>

<ellipse cx="100" cy="103" rx="46" ry="70" fill="#e30613"/>

<!-- Torre Eiffel simplificada -->
<polygon points="100,60 122,146 110,146 100,116 90,146 78,146" fill="#f5f5f5"/>
<rect x="86" y="97" width="28" height="4" rx="1" fill="#f5f5f5"/>
<rect x="92" y="78" width="16" height="3" rx="1" fill="#f5f5f5"/>

<!-- Flor de lis, pequeña, a la izquierda de la torre -->
<g fill="#c9a24b">
  <ellipse cx="70" cy="98" rx="5" ry="9" transform="rotate(-18 70 98)"/>
  <ellipse cx="70" cy="98" rx="5" ry="9" transform="rotate(18 70 98)"/>
  <ellipse cx="70" cy="92" rx="4" ry="10"/>
  <rect x="66" y="103" width="8" height="4" rx="1"/>
</g>

<text font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#f5f5f5" letter-spacing="2">
  <textPath href="#psg-arc-top" startOffset="50%" text-anchor="middle">PARIS</textPath>
</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#f5f5f5" letter-spacing="1.5">
  <textPath href="#psg-arc-bottom" startOffset="50%" text-anchor="middle">SAINT-GERMAIN</textPath>
</text>
</svg>
