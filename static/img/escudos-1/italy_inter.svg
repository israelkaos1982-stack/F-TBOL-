<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Inter">
  <defs>
    <radialGradient id="interBg" cx="50%" cy="40%" r="68%">
      <stop offset="0%" stop-color="#0b56b0"/>
      <stop offset="55%" stop-color="#013a86"/>
      <stop offset="100%" stop-color="#001536"/>
    </radialGradient>
  </defs>
  <!-- Nerazzurri concentric rings: black · blue · gold · blue -->
  <circle cx="100" cy="100" r="99" fill="#000000"/>
  <circle cx="100" cy="100" r="93" fill="url(#interBg)"/>
  <circle cx="100" cy="100" r="84" fill="none" stroke="#000000" stroke-width="3"/>
  <circle cx="100" cy="100" r="80" fill="none" stroke="#cb9a3e" stroke-width="5"/>
  <circle cx="100" cy="100" r="73" fill="none" stroke="#000000" stroke-width="2.5"/>
  <!-- Interlaced club-initials monogram, tilted as on the classic badge -->
  <g transform="rotate(-9 100 102)">
    <text x="100" y="123" font-size="74" font-weight="700" letter-spacing="-12"
          text-anchor="middle" font-family="Georgia,'Times New Roman',serif"
          fill="#cb9a3e" stroke="#000000" stroke-width="1.5" paint-order="stroke">FCIM</text>
  </g>
</svg>
