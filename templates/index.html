  <script>
    /* ── PROGRESO REAL DEL SPLASH (2026-07-28) ────────────────────────────
       Placeholder definido aquí, ANTES de cualquier <link>/<script> que
       pueda completarse primero, para que ningún hito de carga se pierda
       por orden de ejecución (la hoja de fuentes, más abajo, puede cargar
       antes de que #boot-splash llegue a montar su barra). `#boot-splash`
       (en <body>) lo SUSTITUYE por la versión real en cuanto monta —
       hasta entonces esto solo acumula el máximo conocido. */
    window._bootBump = function(pct){
      if (typeof pct !== 'number') return;
      if (!(typeof window._bootProgressPre === 'number') || pct > window._bootProgressPre) {
        window._bootProgressPre = pct;
      }
    };
  </script>
  <!-- preconnect elimina la latencia de DNS+TCP antes de que el parser
       llegue al <link> de fuentes; crossorigin es necesario para gstatic -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- media="print" + onload hace la carga NO bloqueante: la hoja se
       descarga en segundo plano y se aplica al terminar. Sin esto el
       navegador detiene todo el render hasta recibir la respuesta de
       Google (latencia típica 200-800 ms en móvil). -->
  <link rel="stylesheet" media="print" onload="this.media='all';window._bootBump&&window._bootBump(20);"
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@300;400;600;700&family=Rajdhani:wght@400;600;700&display=swap">

       Bug usuario (foto 1): "la parte de abajo de la pantalla no se ve,
       te corta 1/4 de la visual en cualquier pantalla".

       En móviles `100vh` mide el viewport GRANDE (incluye la zona que
       tapan la barra de direcciones / la barra de gestos del sistema),
       así que el último tramo del contenido quedaba debajo de la UI del
       navegador o sin pintar (negro). `100dvh` (dynamic viewport
       height) mide SOLO lo realmente visible, y la safe-area añade
       margen extra para la barra inferior del sistema. */
    @supports (height: 100dvh) {
      html, body { min-height: 100dvh; }
      .screen { min-height: 100dvh; }
    }
    body {
      /* +safe-area para que el último contenido no quede bajo la barra
         inferior del sistema/navegador. */
      padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)) !important;
    }

  <script>
    /* Registrar Service Worker para cachear activos estáticos (JS/CSS).
       Beneficio: en la 2ª visita o tras un cold-start de Railway, los
       1.4 MB de activos se sirven desde caché → sin descarga → JS thread
       más libre → splash se cierra antes en dispositivos lentos. */
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').then(function(reg){
        /* ── AVISO DE VERSIÓN NUEVA (2026-07-06) ──────────────────────
           Bug recurrente documentado en CLAUDE.md (regla "Todo cambio en
           index.bundle.js/.css DEBE bumpear su ?v=X.X"): aunque el bundle
           se bumpee y despliegue correctamente, una pestaña que lleva
           tiempo abierta sigue ejecutando el JS que cargó en su momento —
           el navegador solo descarga el bundle nuevo en la PRÓXIMA carga
           completa de la página. Sin ningún aviso, el usuario reintenta
           una y otra vez sobre el mismo JS viejo (p.ej. el picker de
           portería imbatida con un fix ya mergeado en el servidor pero
           nunca descargado en su pestaña) creyendo que el bug sigue sin
           arreglar. Este banner detecta cuándo hay una versión más nueva
           disponible y deja que el usuario decida cuándo recargar (NUNCA
           recarga solo — un partido en curso vive en memoria y una
           recarga forzada lo perdería). */
        function _showSwUpdateBanner(){
          try {
            if (document.getElementById('sw-update-banner')) return;
            var b = document.createElement('div');
            b.id = 'sw-update-banner';
            /* Arriba (no abajo): el borde inferior de la pantalla suele
               tener los botones de acción del partido (FINALIZAR/Menú) y,
               si el panel de diagnóstico temporal está activo, también
               ocupa esa zona — un banner fijo abajo se solaparía con
               ambos. */
            b.style.cssText = 'position:fixed;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top,0px));z-index:2147483000;'
              + 'background:linear-gradient(160deg,#0a2a1a,#062015);border:1px solid rgba(120,220,150,.6);'
              + 'border-radius:10px;padding:12px 14px;font-family:Oswald,Rajdhani,sans-serif;color:#eafff0;'
              + 'box-shadow:0 4px 20px rgba(0,0,0,.5);display:flex;align-items:center;gap:10px;'
              + 'justify-content:space-between;animation:swBannerIn .25s ease-out;';
            b.innerHTML = '<style>@keyframes swBannerIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}</style>'
              + '<span style="font-size:12.5px;line-height:1.35;">🔄 Hay una versión más nueva de la web (corrige bloqueos). Recarga cuando no tengas un partido a medias.</span>'
              + '<button id="sw-update-btn" style="flex:none;background:rgba(120,220,150,.25);border:1px solid rgba(120,220,150,.7);'
              + 'color:#c8ffd8;border-radius:8px;padding:9px 12px;font-family:Oswald,sans-serif;font-size:12px;'
              + 'letter-spacing:1px;cursor:pointer;white-space:nowrap;">RECARGAR</button>';
            document.body.appendChild(b);
            var btn = document.getElementById('sw-update-btn');
            if (btn) btn.onclick = function(){ try { window.location.reload(); } catch(_){} };
          } catch(_){}
        }
        /* Ya había una versión nueva instalada esperando (deploy previo a
           esta carga). */
        if (reg.waiting && navigator.serviceWorker.controller) _showSwUpdateBanner();
        reg.addEventListener('updatefound', function(){
          var nw = reg.installing;
          if (!nw) return;
          nw.addEventListener('statechange', function(){
            /* `installed` + ya hay un controller (no es la 1ª instalación
               de este navegador) = versión nueva disponible. */
            if (nw.state === 'installed' && navigator.serviceWorker.controller) _showSwUpdateBanner();
          });
        });
        /* La pestaña puede llevar horas/días abierta sin recargar — se
           comprueba periódicamente si hay una versión nueva en el
           servidor (barato: solo un fetch condicional de /sw.js). */
        setInterval(function(){ try { reg.update(); } catch(_){} }, 120000);
        document.addEventListener('visibilitychange', function(){
          if (document.visibilityState === 'visible') { try { reg.update(); } catch(_){} }
        });
      }).catch(function(){});
    }
  </script>

  <!-- ═══ BOOT SPLASH ════════════════════════════════════════════════
       Petición usuario 2026-05-19: "al cargar la web emerge la pantalla
       antigua y tarda unos segundos en mostrar la actual". Causa: la
       app renderiza primero con datos de localStorage (que pueden ser
       viejos de la sesión anterior) y luego un fetch a /api/liga-ext/*
       / /api/kv/* actualiza el contenido → flash de DATOS viejos →
       nuevos. Este splash CUBRE el contenido durante la ventana de
       hidratación inicial (~1.8 s) y se desvanece. Tap para cerrar
       antes (no atasca si el server tarda). Solo en la PRIMERA carga
       del documento — las navegaciones internas (go()) no lo
       muestran. ════════════════════════════════════════════════════ -->
  <div id="boot-splash" aria-hidden="true">
    <div class="boot-splash-logo">
      <span class="boot-splash-11">ISRA -</span>
      <span class="boot-splash-title">Efootball</span>
    </div>

    <div class="boot-splash-progress-wrap">

  <style>
    #boot-splash{
      position:fixed;inset:0;z-index:2147483646;
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
      background:radial-gradient(ellipse at center,#0a0f1c 0%,#04060e 70%,#000 100%);
      transition:opacity .35s ease;
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
      /* BACKSTOP A PRUEBA DE BLOQUEO (2026-06-25 — usuario «no me abre la web»,
         foto clavada en CARGANDO…).  El setTimeout(doHide) del IIFE corre en el
         HILO PRINCIPAL, que queda BLOQUEADO 5-15 s en móvil parseando/ejecutando
         los ~6.5 MB inline + decenas de IIFEs síncronos → el timer se encola pero
         NO dispara, y el tap tampoco responde (su handler también es JS).  Esta
         animación de OPACIDAD corre en el COMPOSITOR (igual que el spinner, que
         por eso sí gira durante el bloqueo), así que levanta la cortina aunque el
         hilo JS esté atascado.  `pointer-events:none` al final deja pasar los
         toques a la app de debajo aunque el elemento siga en el DOM.  En una carga
         sana el JS oculta+elimina el splash en cuanto el progreso real llega al
         100 % y esta animación nunca llega a importar (arranca a los 16 s — justo
         después del backstop JS de 15 s, que es el que debería disparar primero
         en el 99 % de los casos; esta es la ÚLTIMA red, solo para cuando el hilo
         JS está completamente atascado y ni siquiera ese setTimeout dispara). */
      animation:bootSplashAutoFade .6s ease 16s forwards;
    }
    #boot-splash.hide{opacity:0;pointer-events:none;}
    @keyframes bootSplashAutoFade{to{opacity:0;visibility:hidden;pointer-events:none;}}
    .boot-splash-logo{display:flex;align-items:baseline;gap:10px;}
    .boot-splash-11{
      font-family:'Bebas Neue',Oswald,sans-serif;font-size:48px;font-weight:900;
      color:#ff4444;text-shadow:0 0 16px rgba(255,60,60,.6),0 0 32px rgba(255,60,60,.35);
      letter-spacing:1px;
    }
    .boot-splash-title{
      font-family:'Bebas Neue',Oswald,sans-serif;font-size:36px;font-weight:700;
      color:#f0c040;letter-spacing:6px;text-shadow:0 0 18px rgba(240,192,64,.55);
    }
    .boot-splash-spinner{
      width:38px;height:38px;border-radius:50%;
      border:3px solid rgba(240,192,64,.18);

    }

    .boot-splash-hint{
      font-family:Oswald,sans-serif;font-size:11px;letter-spacing:3px;
      color:rgba(255,255,255,.45);text-transform:uppercase;
    }
    /* Barra de progreso REAL (2026-07-28): sustituye la espera "a ciegas"
       por hitos de carga genuinos (fuentes, misc_body_1/2, bundle, y la
       hidratación del menú del hub) — nunca un contador falso animado. */
    .boot-splash-progress-wrap{
      display:flex;align-items:center;gap:12px;width:230px;max-width:64vw;
    }
    .boot-splash-bar-track{

    }

    }
    .boot-splash-pct{
      font-family:Oswald,sans-serif;font-size:14px;font-weight:700;

  <script>
    /* Splash con PROGRESO REAL (2026-07-28, refuerzo). Sustituye el modelo
       de "cerrar a ciegas tras N ms" que abría la web ANTES de que
       `_hydrateMenuFromServer` + `_applyTriple()` (misc_body_1.html)
       terminaran de traer y pintar los overrides del menú del hub — eso
       producía el bug original (flash de "web antigua" → "web actual").

       REFUERZO (mismo día, usuario reportó «se queda en 0%»): la primera
       versión solo pintaba el % en saltos grandes (20/55/75/90/96/100)
       disparados por unos pocos `<script>` de hito repartidos por el
       documento. Si CUALQUIERA de esos hitos no llega a tiempo (red
       lenta a Railway, fuente que tarda, etc.) el número se queda
       CLAVADO en el último salto — el usuario ve "0%" fijo y parece
       roto. Ahora el % en pantalla es un CONTADOR que SIEMPRE sube de 1
       en 1 (vía `setInterval`), alimentado por dos fuentes que se
       combinan con el máximo:
       1) Relleno por TIEMPO transcurrido (tope 92%) — garantiza que la
          barra avanza sola aunque ningún hito real haya llegado aún.
       2) Los hitos reales de carga (fuentes, misc_body_1/2, bundle,
          DOMContentLoaded, window.load) — adelantan el contador cuando
          llegan antes que el relleno por tiempo.
       El cierre real (100 %) SOLO ocurre por:
       - la señal REAL de hidratación del menú (`window._bootSplashHide()`,
         invocada por misc_body_1.html tras `_hydrateMenuFromServer`), o
       - el backstop de seguridad (red muerta / fallo inesperado), o
       - el usuario tocando la pantalla (escape silencioso, sin texto). */
    (function(){
      var el = document.getElementById('boot-splash');
      if (!el) return;
      var barEl = document.getElementById('boot-splash-bar');
      var pctEl = document.getElementById('boot-splash-pct');
      var MIN_MS  = (typeof window._BOOT_SPLASH_MIN_MS  === 'number') ? window._BOOT_SPLASH_MIN_MS  :   700;
      var HARD_MS = (typeof window._BOOT_SPLASH_HARD_MS === 'number') ? window._BOOT_SPLASH_HARD_MS : 15000;
      var startedAt = Date.now();
      var hidden = false;
      var target = 0;   /* techo real (hitos + relleno por tiempo) — nunca retrocede */
      var shown  = 0;   /* % PINTADO — sube de 1 en 1 hasta alcanzar `target` */
      var tickTimer = null;

      function render(){
        if (barEl) barEl.style.width = shown + '%';
        if (pctEl) pctEl.textContent = shown + '%';
      }
      function bump(pct){ if (typeof pct === 'number' && pct > target) target = pct; }

      function doHide(){
        if (hidden) return;
        hidden = true;
        if (tickTimer) { clearInterval(tickTimer); tickTimer = null; }
        target = 100; shown = 100; render();
        el.classList.add('hide');
        setTimeout(function(){ if (el && el.parentNode) el.parentNode.removeChild(el); }, 380);
      }
      /* hide() = la vía "normal": respeta un mínimo de visibilidad (no
         parpadea si todo ya estaba cacheado y carga en <700ms). */
      function hide(){
        if (hidden) return;
        var elapsed = Date.now() - startedAt;
        if (elapsed < MIN_MS) { setTimeout(hide, MIN_MS - elapsed); return; }
        doHide();
      }

      /* Contador visible 0→1→2→3…→100: cada tick (45 ms) sube 1 punto
         hacia `target`. El relleno por tiempo transcurrido (tope 92%) es
         lo que garantiza que NUNCA se queda clavado en 0%, pase lo que
         pase con los hitos reales. */
      tickTimer = setInterval(function(){
        var trickle = Math.min(92, (Date.now() - startedAt) / 70);
        if (trickle > target) target = trickle;
        if (shown < target) { shown = Math.min(Math.ceil(target), shown + 1); render(); }
      }, 45);

      /* `_bootBump` real: sustituye el placeholder definido en <head>
         (que solo acumulaba en `_bootProgressPre`) y absorbe ya mismo lo
         que se hubiera acumulado antes de que este bloque montara. */
      window._bootBump = function(pct){ if (!hidden) bump(pct); };
      if (typeof window._bootProgressPre === 'number') bump(window._bootProgressPre);

      /* `_bootSplashHide` = la señal de "ya está todo pintado con los
         datos correctos" (misc_body_1.html la llama tras
         `_hydrateMenuFromServer`+`_applyTriple`). Es la única vía
         "normal" al 100 %. */
      window._bootSplashHide = function(){ bump(100); hide(); };

      /* Escape manual SILENCIOSO (sin texto visible — petición usuario
         2026-07-28): tocar la pantalla sigue permitiendo salir antes. */
      el.addEventListener('click', hide, { once:true });
      el.addEventListener('touchend', hide, { once:true });

      /* DOMContentLoaded: TODO el HTML (misc_body_1/2 + el bundle) ya se
         parseó y ejecutó — es un hito GARANTIZADO por el navegador, no
         depende de en qué punto exacto del documento coloquemos un
         `<script>` de progreso suelto. */
      function onDom(){ bump(92); }
      if (document.readyState === 'interactive' || document.readyState === 'complete') onDom();
      else document.addEventListener('DOMContentLoaded', onDom, { once:true });

      /* window.load: imágenes/hojas de estilo también listas. NO llega a
         100 — se reserva el 100 real para la señal de hidratación o el
         backstop, así el contador nunca "miente" antes de tiempo. */
      window.addEventListener('load', function(){ bump(96); });

      /* Backstop: si la señal real nunca llega (fallo de red, endpoint
         caído, lo que sea), la web se revela igual — nunca se queda
         atascada en CARGANDO para siempre. */
      setTimeout(function(){ bump(100); hide(); }, HARD_MS);

      /* BFCache: al restaurar desde el historial el DOM ya está listo. */
      window.addEventListener('pageshow', function(e){ if (e.persisted) doHide(); });
    })();
  </script>

  <script>
  /* ── PARCHE INLINE: bloquea el overlay central de gol ──────────────────
     Corre inmediatamente después del bundle, sin depender de archivos
     externos cacheados. Es la última línea de defensa. */
  (function(){
    /* 1. Ocultar el elemento si ya existe */
    function hideOverlay(){
      var el=document.getElementById('mm-event-flash');
      if(!el)return;
      el.style.setProperty('display','none','important');
      el.style.setProperty('visibility','hidden','important');
      el.style.setProperty('opacity','0','important');
      el.classList.remove('show','mm-flash-gol','mm-flash-roja');
    }

    /* 2. Parchear window.mmShowFlash para goles */
    var _origFlash = window.mmShowFlash;
    window.mmShowFlash = function(type, teamName, playerName){
      if(type === 'gol'){
        /* Delegar al sistema mejorado si está disponible */
        if(window.goalNotificationImproved){
          /* Buscar el partido por nombre de equipo */
          var matches=document.querySelectorAll('[id^="mlw-"]');
          var matchId=null, team='a';
          for(var i=0;i<matches.length;i++){
            var names=matches[i].querySelectorAll('.ml-team-name');
            for(var j=0;j<names.length;j++){
              if(names[j].textContent.includes(teamName)){
                matchId=matches[i].id.replace('mlw-','');
                team=(j===1)?'b':'a';
                break;
              }
            }
            if(matchId)break;
          }
          if(matchId) window.goalNotificationImproved.show(matchId,team,playerName||'');
        }
        hideOverlay();
        return; /* NUNCA mostrar el overlay central */
      }
      /* Para otros tipos (roja) usar el comportamiento original */
      if(_origFlash) _origFlash(type,teamName,playerName);
    };

    /* 3. MutationObserver sobre el elemento para bloquear cualquier
          intento de mostrar el overlay (incluso si viene de código privado) */
    function watchOverlay(){
      var el=document.getElementById('mm-event-flash');
      if(!el||el._blocked)return;
      el._blocked=true;
      hideOverlay();
      new MutationObserver(function(){hideOverlay();})
        .observe(el,{attributes:true,attributeFilter:['class','style']});
    }
    /* Observar body para cuando el elemento se cree dinámicamente */
    new MutationObserver(function(ms){
      ms.forEach(function(m){
        m.addedNodes.forEach(function(n){
          if(n.id==='mm-event-flash'){hideOverlay();watchOverlay();}
        });
      });
      watchOverlay();
    }).observe(document.body,{childList:true});

    watchOverlay();
    setInterval(hideOverlay,150);
  })();
  </script>

  (function(){
    function purgeGooool(){
      document.querySelectorAll('.ml-goal-flash-inner').forEach(function(el){el.remove();});
    }
    purgeGooool();
    new MutationObserver(purgeGooool).observe(document.body,{childList:true,subtree:true});
  })();
  </script>

  <script>
    document.addEventListener('DOMContentLoaded', function(){
      /* Agrupa cada back-btn con el icono de inicio */
      document.querySelectorAll('.back-btn').forEach(function(btn){
        if(btn.closest('.nav-row')) return;
        var row = document.createElement('div');
        row.className = 'nav-row';
        btn.parentNode.insertBefore(row, btn);
        row.appendChild(btn);
        /* IMPORTANTE: usar un <button> con go('s-home') en lugar de un
           <a href="/"> para evitar que el navegador recargue la página
           entera y destruya todo el estado JavaScript. Una recarga mata
           cualquier partido live en curso (gm-modal, amistosos, etc).
           Con go('s-home') mantenemos la SPA viva y los cronómetros
           siguen corriendo en segundo plano. */
        var homeBtn = document.createElement('button');
        homeBtn.type = 'button';
        homeBtn.className = 'home-icon-btn';
        homeBtn.setAttribute('aria-label', 'Ir al inicio');
        homeBtn.textContent = '🏠';
        homeBtn.addEventListener('click', function(ev){
          ev.preventDefault();
          ev.stopPropagation();
          if (typeof window.go === 'function') {
            try { window.go('s-home'); return; } catch(_){}
          }
          /* Último recurso: si go no está disponible, recarga la home
             SOLO si realmente no hay forma de navegar sin romper nada. */
          try { window.location.hash = '#/'; } catch(_){}
        });
        row.appendChild(homeBtn);
      });
      /* Nuclear override: fuerza 80px en TODOS los cards del home */
      var sels = [
        '#s-home .menu-card',
        '#s-home .equipo-card',
        '#s-home .mc-athletic',
        '#s-home .mc-betis',
        '#s-home .mc-sociedad',
        '#s-home .mc-madrid',
        '#s-home .mc-barca'
      ];
      var props = ['height','min-height','max-height'];
      sels.forEach(function(s){
        document.querySelectorAll(s).forEach(function(el){
          props.forEach(function(p){ el.style.setProperty(p,'80px','important'); });
          el.style.setProperty('overflow','hidden','important');
          el.style.setProperty('position','relative','important');
          el.style.setProperty('box-sizing','border-box','important');
        });
      });
    });
  </script>
  <script>
  /* ════════════════════════════════════════════════════════════════
     AVISO DE BD EFÍMERA (2026-06-13) — petición usuario:
     «el resto de ligas da muchos dolores de cabeza, ahora salen ligas
     de países sin equipos y estaban absolutamente todos hechos».

     Causa raíz CONFIRMADA (/api/debug → backend "sqlite", EFÍMERA): en
     Railway sin plugin Postgres la SQLite del contenedor se BORRA en
     CADA deploy/restart → el servidor pierde TODOS los `liga_ext_*`.
     Cuando además el navegador del usuario tiene los datos borrados (o
     entra desde otro dispositivo), no hay de dónde recuperar y las
     ligas salen «sin equipos» aunque estuvieran todas hechas. NO es un
     bug de fusión (el anti-wipe funciona); es que no hay nada DURABLE
     debajo. Es exactamente la regla 9 de CLAUDE.md.

     No podemos arreglar la persistencia desde el código (es config de
     Railway). Lo que SÍ hacemos: convertir esta catástrofe SILENCIOSA
     en un aviso VISIBLE y accionable, para que el usuario sepa al
     instante que sus datos NO se están guardando y cómo arreglarlo de
     forma permanente. El aviso desaparece solo cuando la BD pasa a ser
     Postgres persistente (backend === "postgresql").
     ════════════════════════════════════════════════════════════════ */
  (function(){
    function showEphemeralBanner(info){
      try {
        if (document.getElementById('ephemeral-db-warning')) return;
        var nTeams = 0;
        try {
          (info.ligas_ext || []).forEach(function(l){ nTeams += (l && +l.teams) || 0; });
        } catch(_){}
        var nLigas = (info.counts && info.counts.liga_ext_rows) || 0;
        var bar = document.createElement('div');
        bar.id = 'ephemeral-db-warning';
        bar.style.cssText = [
          'position:fixed','top:0','left:0','right:0','z-index:99999',
          'background:linear-gradient(90deg,#7a0010,#cf142b,#7a0010)',
          'color:#fff','font-family:Oswald,Rajdhani,sans-serif',
          'padding:10px 44px 10px 14px','box-shadow:0 2px 12px rgba(0,0,0,.6)',
          'border-bottom:2px solid #ffd633','line-height:1.32','font-size:13px'
        ].join(';');
        bar.innerHTML =
          '<div style="max-width:760px;margin:0 auto;">'
          + '<b style="color:#ffd633;font-size:14px;">⚠️ ATENCIÓN: el servidor NO está guardando los datos de forma permanente.</b><br>'
          + 'La base de datos es <b>efímera (SQLite)</b>: en cada actualización de la app se BORRA todo lo del servidor '
          + '(por eso «Resto de Ligas» aparece sin equipos aunque los tuvieras todos hechos). '
          + 'Ahora mismo el servidor guarda <b>' + nLigas + '</b> ligas / <b>' + nTeams + '</b> equipos.<br>'
          + '<b style="color:#ffd633;">Arreglo permanente (2 min):</b> en Railway → tu proyecto → <b>+ New → Database → Add PostgreSQL</b>. '
          + 'Railway inyecta <code>DATABASE_URL</code> automáticamente y la app pasa a Postgres persistente al re-desplegar. '
          + '<b>Antes de hacerlo, exporta un backup</b> desde 🖍 Editar → 💾 (por si acaso).'
          + '</div>'
          + '<button id="ephemeral-db-warning-x" aria-label="Cerrar" style="position:absolute;top:6px;right:10px;'
          + 'background:transparent;border:none;color:#fff;font-size:20px;cursor:pointer;line-height:1;">✕</button>';
        document.body.appendChild(bar);
        /* Empujar el contenido hacia abajo para no tapar la cabecera. */
        try { document.body.style.paddingTop = (bar.offsetHeight + 4) + 'px'; } catch(_){}
        var x = document.getElementById('ephemeral-db-warning-x');
        if (x) x.addEventListener('click', function(){
          try { bar.remove(); document.body.style.paddingTop = ''; } catch(_){}
          /* Solo se oculta para ESTA sesión: vuelve a salir en el
             próximo arranque mientras la BD siga siendo efímera. */
          try { sessionStorage.setItem('ephemeralDbWarnDismissed', '1'); } catch(_){}
        });
      } catch(_){}
    }
    function checkDb(){
      try {
        var dismissed = false;
        try { dismissed = sessionStorage.getItem('ephemeralDbWarnDismissed') === '1'; } catch(_){}
        if (dismissed) return;
        fetch('/api/debug', { credentials:'same-origin' })
          .then(function(r){ return r.ok ? r.json() : null; })
          .then(function(j){
            if (!j) return;
            /* Solo avisamos si NO es Postgres persistente. */
            if (j.backend !== 'postgresql') showEphemeralBanner(j);
          })
          .catch(function(){});
      } catch(_){}
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function(){ setTimeout(checkDb, 800); });
    } else {
      setTimeout(checkDb, 800);
    }
  })();
  </script>
