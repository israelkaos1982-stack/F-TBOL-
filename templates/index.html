  <script>
    /* ── COLA de DOMContentLoaded (2026-07-29) ────────────────────────────
       Diagnóstico confirmado con datos reales del usuario: el splash se
       queda clavado en "hydrate-start" (la última marca ANTES de esperar
       la respuesta de `/api/kv/menu_home_v1`) durante MINUTOS. Esa función
       es async (fetch) y NO bloquea nada — el hilo principal queda LIBRE
       en cuanto se llama. La explicación real: TODOS los listeners de
       `DOMContentLoaded` de este documento (~90, repartidos entre
       misc_body_1.html y misc_body_2.html) se disparan SEGUIDOS, dentro
       de UNA SOLA tarea síncrona ininterrumpible del navegador — es el
       comportamiento NATIVO del evento, no algo que este proyecto pueda
       evitar registrando cada listener por separado. El de la hidratación
       del menú (que deja la marca "hydrate-start") es de los PRIMEROS en
       registrarse — así que aunque él mismo termine al instante, el
       navegador NO puede pintar la pantalla, ni disparar el backstop de
       seguridad (`setTimeout`), ni procesar la respuesta del `fetch`,
       hasta que TODOS los ~90 listeners posteriores terminen de correr —
       si CUALQUIERA de ellos tarda mucho (o cuelga), el splash entero
       queda clavado, por más marcas de diagnóstico que tenga.

       Fix genérico, en el chokepoint único: se sustituye
       `document.addEventListener` (SOLO para el tipo 'DOMContentLoaded',
       y SOLO en el objeto `document` — el resto de eventos/objetos
       quedan intactos) para que, en vez de registrar el listener de
       forma nativa, lo ENCOLE. Cuando el evento real dispara, se
       recorre la cola invocando un listener por macrotask
       (`setTimeout(fn,0)` encadenado) — MISMO orden que antes (cada
       script sigue registrando su listener en el mismo punto de
       siempre), pero AHORA cada uno corre en su PROPIA tarea. Entre
       uno y el siguiente el navegador puede pintar, procesar el
       backstop de 6s en cuanto se cumpla, y resolver el `fetch` de la
       hidratación — así un listener lento ya NO bloquea a los demás
       ni le impide al splash cerrarse cuando corresponda. */
    (function(){
      var queue = [];
      var fired = false;
      var nativeAdd = document.addEventListener.bind(document);
      document.addEventListener = function(type, listener, opts){
        if (type === 'DOMContentLoaded' && !fired) {
          queue.push(listener);
          return;
        }
        return nativeAdd(type, listener, opts);
      };
      /* Etiqueta legible de un listener (2026-07-29, refuerzo): el número
         de orden por sí solo obliga a contar registros a mano por todo
         el código — frágil (algunos solo se registran bajo condición).
         Si la función tiene nombre (`function _bootPlantAll(){}` o
         similar) se usa tal cual; si es anónima, un trozo de su propio
         código sirve para localizarla con un grep directo. */
      function _labelFor(fn){
        try {
          if (fn && fn.name) return fn.name;
          var src = String(fn).replace(/\s+/g, ' ').trim();
          return src.slice(0, 46);
        } catch(_){ return 'anon'; }
      }
      function runStep(i){
        if (i >= queue.length) {
          try { if (window._bootMark) window._bootMark('dcl-queue-done'); } catch(_){}
          return;
        }
        /* Marca de posición (2026-07-29): si UN listener concreto es
           tan lento que ni siquiera el diferido por macrotask evita
           que se note, esta marca queda clavada con SU número de
           orden Y su nombre/snippet — dice exactamente cuál de los
           ~130 es, sin tener que adivinar por el %. */
        try { if (window._bootMark) window._bootMark('dcl#' + (i+1) + '/' + queue.length + ' ' + _labelFor(queue[i])); } catch(_){}
        var fn = queue[i];
        try {
          if (typeof fn === 'function') fn();
          else if (fn && typeof fn.handleEvent === 'function') fn.handleEvent();
        } catch(e){ try{ console.error('[boot] DOMContentLoaded listener error', e); }catch(_){} }
        setTimeout(function(){ runStep(i + 1); }, 0);
      }
      nativeAdd('DOMContentLoaded', function(){
        fired = true;
        runStep(0);
      }, { once: true });
    })();
  </script>
  <script>
    /* ── PROGRESO REAL DEL SPLASH (2026-07-28) ────────────────────────────
       Placeholder definido aquí, ANTES de cualquier <link>/<script> que
       pueda completarse primero, para que ningún hito de carga se pierda
       por orden de ejecución (la hoja de fuentes, más abajo, puede cargar
       antes de que #boot-splash llegue a montar su barra). `#boot-splash`
       (en <body>) lo SUSTITUYE por la versión real en cuanto monta —
       hasta entonces esto solo acumula el máximo conocido. */
    window._bootBump = function(pct){
      if (typeof pct !== 'number') return;
      if (!(typeof window._bootProgressPre === 'number') || pct > window._bootProgressPre) {
        window._bootProgressPre = pct;
      }
    };
    /* ── DIAGNÓSTICO DE FASE (2026-07-29) ──────────────────────────────
       El % por sí solo no dice QUÉ fase concreta se está ejecutando
       cuando se queda clavado (puede ser puro relleno por tiempo
       transcurrido, sin ningún hito real todavía). `_bootMark(label)`
       deja constancia de la ÚLTIMA fase alcanzada — placeholder aquí
       (antes de que `#boot-splash` monte su texto real), igual que
       `_bootBump`. Si el arranque se congela entre la fase N y la
       N+1, el texto de la fase N queda pintado en pantalla para
       siempre — un screenshot del usuario dice exactamente dónde se
       atascó, sin tener que adivinar a partir del %. Puramente
       informativo: no cambia ni el cálculo ni el cierre del splash. */
    window._bootTimelinePre = [];
    window._bootMark = function(label){
      try { window._bootTimelinePre.push({ label: label, t: Date.now() }); } catch(_){}
    };
  </script>

    /* ── ALTURA DE VIEWPORT MÓVIL + SAFE-AREA (2026-06-05) ──────────
       Bug usuario (foto 1): "la parte de abajo de la pantalla no se ve,
       te corta 1/4 de la visual en cualquier pantalla".

       En móviles `100vh` mide el viewport GRANDE (incluye la zona que
       tapan la barra de direcciones / la barra de gestos del sistema),
       así que el último tramo del contenido quedaba debajo de la UI del
       navegador o sin pintar (negro). `100dvh` (dynamic viewport
       height) mide SOLO lo realmente visible, y la safe-area añade
       margen extra para la barra inferior del sistema. */
    @supports (height: 100dvh) {
      html, body { min-height: 100dvh; }
      .screen { min-height: 100dvh; }
    }
    body {
      /* +safe-area para que el último contenido no quede bajo la barra
         inferior del sistema/navegador. */

  <script>
    /* Registrar Service Worker para cachear activos estáticos (JS/CSS).
       Beneficio: en la 2ª visita o tras un cold-start de Railway, los
       1.4 MB de activos se sirven desde caché → sin descarga → JS thread
       más libre → splash se cierra antes en dispositivos lentos. */
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').then(function(reg){
        /* ── AVISO DE VERSIÓN NUEVA (2026-07-06) ──────────────────────
           Bug recurrente documentado en CLAUDE.md (regla "Todo cambio en
           index.bundle.js/.css DEBE bumpear su ?v=X.X"): aunque el bundle
           se bumpee y despliegue correctamente, una pestaña que lleva
           tiempo abierta sigue ejecutando el JS que cargó en su momento —
           el navegador solo descarga el bundle nuevo en la PRÓXIMA carga
           completa de la página. Sin ningún aviso, el usuario reintenta
           una y otra vez sobre el mismo JS viejo (p.ej. el picker de
           portería imbatida con un fix ya mergeado en el servidor pero
           nunca descargado en su pestaña) creyendo que el bug sigue sin
           arreglar. Este banner detecta cuándo hay una versión más nueva
           disponible y deja que el usuario decida cuándo recargar (NUNCA
           recarga solo — un partido en curso vive en memoria y una
           recarga forzada lo perdería). */
        function _showSwUpdateBanner(){
          try {
            if (document.getElementById('sw-update-banner')) return;
            var b = document.createElement('div');
            b.id = 'sw-update-banner';
            /* Arriba (no abajo): el borde inferior de la pantalla suele
               tener los botones de acción del partido (FINALIZAR/Menú) y,
               si el panel de diagnóstico temporal está activo, también
               ocupa esa zona — un banner fijo abajo se solaparía con
               ambos. */
            b.style.cssText = 'position:fixed;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top,0px));z-index:2147483000;'
              + 'background:linear-gradient(160deg,#0a2a1a,#062015);border:1px solid rgba(120,220,150,.6);'
              + 'border-radius:10px;padding:12px 14px;font-family:Oswald,Rajdhani,sans-serif;color:#eafff0;'
              + 'box-shadow:0 4px 20px rgba(0,0,0,.5);display:flex;align-items:center;gap:10px;'
              + 'justify-content:space-between;animation:swBannerIn .25s ease-out;';
            b.innerHTML = '<style>@keyframes swBannerIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}</style>'
              + '<span style="font-size:12.5px;line-height:1.35;">🔄 Hay una versión más nueva de la web (corrige bloqueos). Recarga cuando no tengas un partido a medias.</span>'
              + '<button id="sw-update-btn" style="flex:none;background:rgba(120,220,150,.25);border:1px solid rgba(120,220,150,.7);'
              + 'color:#c8ffd8;border-radius:8px;padding:9px 12px;font-family:Oswald,sans-serif;font-size:12px;'
              + 'letter-spacing:1px;cursor:pointer;white-space:nowrap;">RECARGAR</button>';
            document.body.appendChild(b);
            var btn = document.getElementById('sw-update-btn');
            if (btn) btn.onclick = function(){ try { window.location.reload(); } catch(_){} };
          } catch(_){}
        }
        /* Ya había una versión nueva instalada esperando (deploy previo a
           esta carga). */
        if (reg.waiting && navigator.serviceWorker.controller) _showSwUpdateBanner();
        reg.addEventListener('updatefound', function(){
          var nw = reg.installing;
          if (!nw) return;
          nw.addEventListener('statechange', function(){
            /* `installed` + ya hay un controller (no es la 1ª instalación
               de este navegador) = versión nueva disponible. */
            if (nw.state === 'installed' && navigator.serviceWorker.controller) _showSwUpdateBanner();
          });
        });
        /* La pestaña puede llevar horas/días abierta sin recargar — se
           comprueba periódicamente si hay una versión nueva en el
           servidor (barato: solo un fetch condicional de /sw.js). */
        setInterval(function(){ try { reg.update(); } catch(_){} }, 120000);
        document.addEventListener('visibilitychange', function(){
          if (document.visibilityState === 'visible') { try { reg.update(); } catch(_){} }
        });
      }).catch(function(){});
    }
  </script>

  <!-- ═══ localForage (rama test-localforage — FASE 2, migración quirúrgica) ═══
       Auditoría previa (Fase 1) en esta misma rama: de las claves pedidas
       (LIGA_PLAYER_MATCH_STORE / ef_player_stats_v1 / ef_player_stats_copa_v1),
       `LIGA_PLAYER_MATCH_STORE` NUNCA vive en localStorage — es
       `window.LIGA_PLAYER_MATCH_STORE`, una variable EN MEMORIA que
       `rebuildPlayerStatsStore()` usa como fuente y nunca persiste
       (misc_body_1.html, comentario explícito "no se persiste a
       localStorage"). No hay nada que migrar ahí. Las 2 claves reales,
       pesadas y de BAJO riesgo (derivadas/reconstruibles, escritas por
       un único punto — `_persistBucket` — con reemplazo total, nunca
       append) son `ef_player_stats_v1` y `ef_player_stats_copa_v1`.
       `ligaExt_*` y `ef_liga38_v4` (las otras 2 claves "gigantes" del
       informe) quedan EXCLUIDAS de esta fase a propósito: tienen
       cientos de lectores SÍNCRONOS (`loadData`/`saveData`, el motor
       de Liga/Copa) — migrarlas de verdad exigiría convertir esa
       cadena a async, que es precisamente el riesgo alto que la Fase 1
       desaconsejó para una migración "quirúrgica". `ef_liga38_v4` SÍ se
       tocó en esta fase, pero SOLO para centralizar sus lecturas/
       escrituras en un getter/setter único (ver misc_body_2.html,
       `window._ef38GetResults`/`_ef38SetResults`/`_ef38ClearResults`)
       — sigue siendo 100% localStorage, sin localForage de por medio.

       ── FIX 2026-08-07 (rama "no funciona") ──────────────────────
       El `<script src="…jsdelivr…">` original NO llevaba `defer`/
       `async`: es un script de un CDN de terceros colocado ANTES del
       `<div id="boot-splash">`, así que BLOQUEABA el parseo de
       `<head>` (y por tanto la aparición del propio splash y todo lo
       que viene después en `<body>`) hasta que el navegador consiguiera
       descargarlo — o hasta agotar el timeout de red si jsdelivr está
       bloqueado/inalcanzable (red móvil restrictiva, firewall
       corporativo, el usuario sin conexión). Es EXACTAMENTE la clase
       de fallo que este proyecto lleva evitando desde siempre (ver
       las docenas de reglas de este archivo sobre XHR síncrono /
       thundering herd / splash que se queda colgado) — solo que aquí
       el bloqueo no es un XHR, es un `<script>` sin `defer`, así que
       el guardián `tools/check_js_blocks.py` (que solo vigila XHR
       síncrono) no lo detecta.

       Fix: el CDN se carga con `defer` (no bloquea el parseo) y el
       cableado de la API (`_lfStatsGet`/`_lfStatsSet`/config) se separa
       en 2 pasos — (1) definir la API SIEMPRE, de forma síncrona y sin
       red, para que cualquier caller (`_persistBucket`) la encuentre
       ya definida aunque el CDN tarde o nunca llegue a cargar; (2) el
       `onload`/`onerror` del script diferido activa `localforage.config`
       + `_lfReady=true` + la resolución de arranque SOLO si/cuando el
       CDN responde — nunca bloqueando nada. Con `_lfReady=false` (CDN
       lento/caído/offline), `_lfStatsSet` sigue escribiendo en
       localStorage igual que siempre — el comportamiento de fallback
       ya existía, ahora también se alcanza sin esperar a la red. -->
  <script>
    window._LF_MIGRATED_KEYS = ['ef_player_stats_v1', 'ef_player_stats_copa_v1'];
    window._lfReady = false;

    window._lfStatsGet = function (key) {
      if (!window._lfReady) return Promise.resolve(null);
      return localforage.getItem(key).then(function (fromLf) {
        /* 1. localForage gana si ya tiene el dato. */
        if (fromLf != null) return fromLf;
        /* 2. Fallback: localStorage → migrar a localForage → log. */
        var legacy = null;
        try { legacy = localStorage.getItem(key); } catch (_) {}
        if (legacy == null) return null;
        return localforage.setItem(key, legacy).then(function () {
          try { console.log('[MIGRATION] ' + key + ' -> IndexedDB OK'); } catch (_) {}
          return legacy;
        }).catch(function (err) {
          try { console.warn('[MIGRATION] ' + key + ' -> IndexedDB FAILED (se sigue usando localStorage)', err); } catch (_) {}
          return legacy;
        });
      }).catch(function (err) {
        try { console.warn('[MIGRATION] lectura de ' + key + ' en IndexedDB falló, cae a localStorage', err); } catch (_) {}
        try { return localStorage.getItem(key); } catch (_) { return null; }
      });
    };

    window._lfStatsSet = function (key, value) {
      if (window._LF_MIGRATED_KEYS.indexOf(key) === -1) return;
      /* localForage primero (fuente autoritativa de esta migración),
         solo si el CDN llegó a cargar. */
      if (window._lfReady) {
        try {
          localforage.setItem(key, value).catch(function (err) {
            try { console.warn('[localForage] setItem falló para ' + key, err); } catch (_) {}
          });
        } catch (_lfWriteErr) {
          try { console.warn('[localForage] setItem lanzó para ' + key, _lfWriteErr); } catch (_) {}
        }
      }
      /* localStorage después — sigue siendo lo que leen los ~40
         dashboards síncronos ("mantener intactas las copias" +
         "sin romper los motores"), y el ÚNICO destino si el CDN
         nunca llegó a cargar. */
      try {
        if (window._lsSetSafe) window._lsSetSafe(key, value);
        else localStorage.setItem(key, value);
      } catch (_lsErr) {
        try { console.warn('[localForage] fallback localStorage.setItem también falló para ' + key, _lsErr); } catch (_) {}
      }
    };

    /* Llamado por el `onload`/`onerror` del script diferido de abajo —
       nunca desde el parseo síncrono de `<head>`. Si `localforage` no
       llegó a definirse (CDN inalcanzable/timeout), `_lfReady` se
       queda en `false` y la API de arriba sigue funcionando en modo
       solo-localStorage sin que nadie tenga que esperar nada. */
    window._lfBootInit = function () {
      try {
        if (typeof localforage === 'undefined') return;
        localforage.config({
          name: 'ftbol_localforage',
          storeName: 'stats_cache_v1',
          description: 'Copia durable (IndexedDB) de claves pesadas de estadísticas — ver test-localforage'
        });
        window._lfReady = true;
      } catch (_lfErr) {
        try { console.warn('[localForage] no disponible, se sigue solo con localStorage:', _lfErr); } catch (_) {}
        return;
      }
      /* Resolver la prioridad real (localForage > localStorage) para
         las 2 claves migradas, UNA vez, antes de que ningún dashboard
         las lea. Async — no bloquea el arranque del resto de la
         página (splash/hidratación siguen su curso normal). */
      window._LF_MIGRATED_KEYS.forEach(function (k) {
        try {
          window._lfStatsGet(k).then(function (val) {
            if (val == null) return;
            try {
              if (window._lsSetSafe) window._lsSetSafe(k, val);
              else localStorage.setItem(k, val);
            } catch (_) {}
          }).catch(function () {});
        } catch (_) {}
      });
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/localforage@1.10.0/dist/localforage.min.js"
          onload="window._lfBootInit()" onerror="window._lfBootInit()"></script>

<body>

  <!-- ═══ BOOT SPLASH ════════════════════════════════════════════════
       Petición usuario 2026-05-19: "al cargar la web emerge la pantalla
       antigua y tarda unos segundos en mostrar la actual". Causa: la
       app renderiza primero con datos de localStorage (que pueden ser
       viejos de la sesión anterior) y luego un fetch a /api/liga-ext/*
       / /api/kv/* actualiza el contenido → flash de DATOS viejos →
       nuevos. Este splash CUBRE el contenido durante la ventana de
       hidratación inicial (~1.8 s) y se desvanece. Tap para cerrar
       antes (no atasca si el server tarda). Solo en la PRIMERA carga

     mutación, con un observer `subtree:true` sobre `document.body`.
     Durante el arranque la app muta el DOM miles de veces (pinta
     clasificaciones, calendarios, plantillas…), así que el coste es
     O(mutaciones × tamaño del DOM). Medido con perfil de CPU real
     (Chromium + CDP): **13,2 s de los 70 s perfilados — el 24 % del
     tiempo total**, y el mayor consumidor de `querySelectorAll` de toda
     la app. Es exactamente el anti-patrón que este mismo archivo ya
     prohíbe en la sección "Cronómetro del partido — BASE INMUTABLE"
     ("MutationObserver global sobre document.body con subtree:true que
     dispara funciones costosas en CADA mutación").
     El observer ya recibe QUÉ nodos se añadieron: basta comprobar esos.
     Mismo efecto (ningún `.ml-goal-flash-inner` sobrevive en el DOM),
     coste proporcional a lo que cambia en vez de a lo que existe.
     PROHIBIDO volver a barrer el documento entero aquí. */
  (function(){
    var SEL = '.ml-goal-flash-inner';
    function purgeIn(node){
      if (!node || node.nodeType !== 1) return;
      try {
        if (node.matches && node.matches(SEL)) { node.remove(); return; }
        if (node.querySelectorAll) {
          var hits = node.querySelectorAll(SEL);
          for (var i = 0; i < hits.length; i++) hits[i].remove();

      } catch(_){}

    try { document.querySelectorAll(SEL).forEach(function(el){ el.remove(); }); } catch(_){}

      for (var r = 0; r < records.length; r++) {
        var added = records[r].addedNodes;
        for (var n = 0; n < added.length; n++) purgeIn(added[n]);
      }

  })();

        btn.parentNode.insertBefore(row, btn);
        row.appendChild(btn);
        /* IMPORTANTE: usar un <button> con go('s-home') en lugar de un
           <a href="/"> para evitar que el navegador recargue la página
           entera y destruya todo el estado JavaScript. Una recarga mata
           cualquier partido live en curso (gm-modal, amistosos, etc).
           Con go('s-home') mantenemos la SPA viva y los cronómetros
           siguen corriendo en segundo plano. */
        var homeBtn = document.createElement('button');
        homeBtn.type = 'button';
        homeBtn.className = 'home-icon-btn';
        homeBtn.setAttribute('aria-label', 'Ir al inicio');
        homeBtn.textContent = '🏠';
        homeBtn.addEventListener('click', function(ev){
          ev.preventDefault();
          ev.stopPropagation();
          if (typeof window.go === 'function') {
            try { window.go('s-home'); return; } catch(_){}
          }
          /* Último recurso: si go no está disponible, recarga la home
             SOLO si realmente no hay forma de navegar sin romper nada. */
          try { window.location.hash = '#/'; } catch(_){}
        });
        row.appendChild(homeBtn);
      });
      /* Nuclear override: fuerza 80px en TODOS los cards del home */
      var sels = [
        '#s-home .menu-card',
        '#s-home .equipo-card',
        '#s-home .mc-athletic',
        '#s-home .mc-betis',
        '#s-home .mc-sociedad',
        '#s-home .mc-madrid',
        '#s-home .mc-barca'
      ];
      var props = ['height','min-height','max-height'];
      sels.forEach(function(s){
        document.querySelectorAll(s).forEach(function(el){
          props.forEach(function(p){ el.style.setProperty(p,'80px','important'); });
          el.style.setProperty('overflow','hidden','important');
          el.style.setProperty('position','relative','important');
          el.style.setProperty('box-sizing','border-box','important');
        });
      });
    });
  </script>
  <script>
  /* ════════════════════════════════════════════════════════════════
     AVISO DE BD EFÍMERA (2026-06-13) — petición usuario:
     «el resto de ligas da muchos dolores de cabeza, ahora salen ligas
     de países sin equipos y estaban absolutamente todos hechos».

     Causa raíz CONFIRMADA (/api/debug → backend "sqlite", EFÍMERA): en
     Railway sin plugin Postgres la SQLite del contenedor se BORRA en
     CADA deploy/restart → el servidor pierde TODOS los `liga_ext_*`.
     Cuando además el navegador del usuario tiene los datos borrados (o
     entra desde otro dispositivo), no hay de dónde recuperar y las
     ligas salen «sin equipos» aunque estuvieran todas hechas. NO es un
     bug de fusión (el anti-wipe funciona); es que no hay nada DURABLE
     debajo. Es exactamente la regla 9 de CLAUDE.md.

     No podemos arreglar la persistencia desde el código (es config de
     Railway). Lo que SÍ hacemos: convertir esta catástrofe SILENCIOSA
     en un aviso VISIBLE y accionable, para que el usuario sepa al
     instante que sus datos NO se están guardando y cómo arreglarlo de
     forma permanente. El aviso desaparece solo cuando la BD pasa a ser
     Postgres persistente (backend === "postgresql").
     ════════════════════════════════════════════════════════════════ */
  (function(){
    function showEphemeralBanner(info){
      try {
        if (document.getElementById('ephemeral-db-warning')) return;
        var nTeams = 0;
        try {
          (info.ligas_ext || []).forEach(function(l){ nTeams += (l && +l.teams) || 0; });
        } catch(_){}
        var nLigas = (info.counts && info.counts.liga_ext_rows) || 0;
        var bar = document.createElement('div');
        bar.id = 'ephemeral-db-warning';
        bar.style.cssText = [
          'position:fixed','top:0','left:0','right:0','z-index:99999',
          'background:linear-gradient(90deg,#7a0010,#cf142b,#7a0010)',
          'color:#fff','font-family:Oswald,Rajdhani,sans-serif',
          'padding:10px 44px 10px 14px','box-shadow:0 2px 12px rgba(0,0,0,.6)',
          'border-bottom:2px solid #ffd633','line-height:1.32','font-size:13px'
        ].join(';');
        bar.innerHTML =
          '<div style="max-width:760px;margin:0 auto;">'
          + '<b style="color:#ffd633;font-size:14px;">⚠️ ATENCIÓN: el servidor NO está guardando los datos de forma permanente.</b><br>'
          + 'La base de datos es <b>efímera (SQLite)</b>: en cada actualización de la app se BORRA todo lo del servidor '
          + '(por eso «Resto de Ligas» aparece sin equipos aunque los tuvieras todos hechos). '
          + 'Ahora mismo el servidor guarda <b>' + nLigas + '</b> ligas / <b>' + nTeams + '</b> equipos.<br>'
          + '<b style="color:#ffd633;">Arreglo permanente (2 min):</b> en Railway → tu proyecto → <b>+ New → Database → Add PostgreSQL</b>. '
          + 'Railway inyecta <code>DATABASE_URL</code> automáticamente y la app pasa a Postgres persistente al re-desplegar. '
          + '<b>Antes de hacerlo, exporta un backup</b> desde 🖍 Editar → 💾 (por si acaso).'
          + '</div>'
          + '<button id="ephemeral-db-warning-x" aria-label="Cerrar" style="position:absolute;top:6px;right:10px;'
          + 'background:transparent;border:none;color:#fff;font-size:20px;cursor:pointer;line-height:1;">✕</button>';
        document.body.appendChild(bar);
        /* Empujar el contenido hacia abajo para no tapar la cabecera. */
        try { document.body.style.paddingTop = (bar.offsetHeight + 4) + 'px'; } catch(_){}
        var x = document.getElementById('ephemeral-db-warning-x');
        if (x) x.addEventListener('click', function(){
          try { bar.remove(); document.body.style.paddingTop = ''; } catch(_){}
          /* Solo se oculta para ESTA sesión: vuelve a salir en el
             próximo arranque mientras la BD siga siendo efímera. */
          try { sessionStorage.setItem('ephemeralDbWarnDismissed', '1'); } catch(_){}
        });
      } catch(_){}
    }
    function checkDb(){
      try {
        var dismissed = false;
        try { dismissed = sessionStorage.getItem('ephemeralDbWarnDismissed') === '1'; } catch(_){}
        if (dismissed) return;
        fetch('/api/debug', { credentials:'same-origin' })
          .then(function(r){ return r.ok ? r.json() : null; })
          .then(function(j){
            if (!j) return;
            /* Solo avisamos si NO es Postgres persistente. */
            if (j.backend !== 'postgresql') showEphemeralBanner(j);
          })
          .catch(function(){});
      } catch(_){}
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function(){ setTimeout(checkDb, 800); });
    } else {
      setTimeout(checkDb, 800);
    }
  })();
  </script>
</body>
