       llegue al <link> de fuentes; crossorigin es necesario para gstatic -->

       Google (latencia típica 200-800 ms en móvil). -->
  <link rel="stylesheet" media="print" onload="this.media='all'"

    /* ── ALTURA DE VIEWPORT MÓVIL + SAFE-AREA (2026-06-05) ──────────
       Bug usuario (foto 1): "la parte de abajo de la pantalla no se ve,
       te corta 1/4 de la visual en cualquier pantalla".

       En móviles `100vh` mide el viewport GRANDE (incluye la zona que
       tapan la barra de direcciones / la barra de gestos del sistema),
       así que el último tramo del contenido quedaba debajo de la UI del
       navegador o sin pintar (negro). `100dvh` (dynamic viewport
       height) mide SOLO lo realmente visible, y la safe-area añade
       margen extra para la barra inferior del sistema. */
    @supports (height: 100dvh) {
      html, body { min-height: 100dvh; }
      .screen { min-height: 100dvh; }
    }
    body {
      /* +safe-area para que el último contenido no quede bajo la barra
         inferior del sistema/navegador. */
      padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)) !important;
    }

       Beneficio: en la 2ª visita o tras un cold-start de Railway, los
       1.4 MB de activos se sirven desde caché → sin descarga → JS thread

    if ('serviceWorker' in navigator) {

  <!-- ═══ BOOT SPLASH ════════════════════════════════════════════════
       Petición usuario 2026-05-19: "al cargar la web emerge la pantalla
       antigua y tarda unos segundos en mostrar la actual". Causa: la
       app renderiza primero con datos de localStorage (que pueden ser
       viejos de la sesión anterior) y luego un fetch a /api/liga-ext/*
       / /api/kv/* actualiza el contenido → flash de DATOS viejos →
       nuevos. Este splash CUBRE el contenido durante la ventana de
       hidratación inicial (~1.8 s) y se desvanece. Tap para cerrar
       antes (no atasca si el server tarda). Solo en la PRIMERA carga
       del documento — las navegaciones internas (go()) no lo
       muestran. ════════════════════════════════════════════════════ -->
  <div id="boot-splash" aria-hidden="true">
    <div class="boot-splash-logo">
      <span class="boot-splash-11">ISRA -</span>
      <span class="boot-splash-title">Efootball</span>
    </div>
    <div class="boot-splash-spinner"></div>
    <div class="boot-splash-hint">Cargando…</div>
    <div class="boot-splash-tap">▶ Toca para continuar</div>
  </div>
  <style>
    #boot-splash{
      position:fixed;inset:0;z-index:2147483646;
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
      background:radial-gradient(ellipse at center,#0a0f1c 0%,#04060e 70%,#000 100%);
      transition:opacity .35s ease;
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
      /* BACKSTOP A PRUEBA DE BLOQUEO (2026-06-25 — usuario «no me abre la web»,
         foto clavada en CARGANDO…).  El setTimeout(doHide) del IIFE corre en el
         HILO PRINCIPAL, que queda BLOQUEADO 5-15 s en móvil parseando/ejecutando
         los ~6.5 MB inline + decenas de IIFEs síncronos → el timer se encola pero
         NO dispara, y el tap tampoco responde (su handler también es JS).  Esta
         animación de OPACIDAD corre en el COMPOSITOR (igual que el spinner, que
         por eso sí gira durante el bloqueo), así que levanta la cortina aunque el
         hilo JS esté atascado.  `pointer-events:none` al final deja pasar los
         toques a la app de debajo aunque el elemento siga en el DOM.  En una carga
         sana el JS oculta+elimina el splash a ~1.5 s y esta animación nunca llega
         a importar (arranca a los 5 s). */
      animation:bootSplashAutoFade .6s ease 5s forwards;
    }
    #boot-splash.hide{opacity:0;pointer-events:none;}
    @keyframes bootSplashAutoFade{to{opacity:0;visibility:hidden;pointer-events:none;}}
    .boot-splash-logo{display:flex;align-items:baseline;gap:10px;}
    .boot-splash-11{
      font-family:'Bebas Neue',Oswald,sans-serif;font-size:48px;font-weight:900;
      color:#ff4444;text-shadow:0 0 16px rgba(255,60,60,.6),0 0 32px rgba(255,60,60,.35);
      letter-spacing:1px;
    }
    .boot-splash-title{
      font-family:'Bebas Neue',Oswald,sans-serif;font-size:36px;font-weight:700;
      color:#f0c040;letter-spacing:6px;text-shadow:0 0 18px rgba(240,192,64,.55);
    }
    .boot-splash-spinner{
      width:38px;height:38px;border-radius:50%;
      border:3px solid rgba(240,192,64,.18);
      border-top-color:#f0c040;
      animation:bootSplashSpin .9s linear infinite;
    }
    @keyframes bootSplashSpin{to{transform:rotate(360deg);}}
    .boot-splash-hint{
      font-family:Oswald,sans-serif;font-size:11px;letter-spacing:3px;
      color:rgba(255,255,255,.45);text-transform:uppercase;
    }
    /* Pista "Toca para continuar": emerge a los 2.8 s via animación CSS
       que corre en el compositor — funciona aunque el hilo JS esté ocupado
       parseando los 100 k líneas de scripts inline. */
    .boot-splash-tap{
      font-family:Oswald,sans-serif;font-size:13px;letter-spacing:2px;
      color:rgba(240,192,64,.85);text-transform:uppercase;
      opacity:0;
      /* OPACITY (no color) → compositor-thread, aparece aunque el hilo JS esté
         bloqueado parseando los scripts inline (color NO se compone y no se veía). */
      animation:bootSplashTapIn .7s ease 2.8s forwards;
    }
    @keyframes bootSplashTapIn{to{opacity:1;}}
  </style>
  <script>
    /* Splash auto-hide RÁPIDO y A PRUEBA DE BLOQUEO.  2026-06-14 — el
       usuario reportó «no se abre la web» (foto: clavada en CARGANDO…).

       Causa raíz de la regresión: el commit abfcd57 ató el ocultado del
       splash a que TODA la hidratación del servidor «se asentara»
       (/api/kv/*, /api/liga-ext/* de decenas de ligas, /api/state…),
       con un tope de 8 s.  En un móvil contra un server frío de Railway
       esas peticiones se solapan continuamente, así que la cortina se
       quedaba los 8 s ENTEROS en cada arranque → se percibe como «la web
       no abre».  Además envolvía `window.fetch` globalmente en el
       arranque, un riesgo innecesario.

       Fix: volvemos al modelo simple y robusto (probado desde
       2026-05-21).  La app es USABLE en DOMContentLoaded (el HTML está
       parseado y el bundle ya ejecutó: render inicial + arranque de la
       hidratación).  Ocultamos poco después de DOM listo:
       - MIN 1000 ms  → no flashear ultra rápido; da a la hidratación
         cache-hit / server caliente un margen para repintar BAJO la
         cortina (reduce el flash de datos viejos) sin bloquear.
       - GRACE 500 ms → margen tras DOM listo.
       - MAX 2500 ms  → tope DURO. La web SIEMPRE abre en ≤2.5 s, pase
         lo que pase con la red o el polling.
       - Tap/click cierra antes. */
    (function(){
      var MIN_MS   = (typeof window._BOOT_SPLASH_MIN_MS   === 'number') ? window._BOOT_SPLASH_MIN_MS   : 1000;
      var GRACE_MS = (typeof window._BOOT_SPLASH_GRACE_MS === 'number') ? window._BOOT_SPLASH_GRACE_MS :  500;
      var MAX_MS   = (typeof window._BOOT_SPLASH_MAX_MS   === 'number') ? window._BOOT_SPLASH_MAX_MS   : 2500;
      var el = document.getElementById('boot-splash');
      if (!el) return;
      var hidden = false;
      var startedAt = Date.now();
      function doHide(){
        if (hidden) return;
        hidden = true;
        el.classList.add('hide');
        setTimeout(function(){ if (el && el.parentNode) el.parentNode.removeChild(el); }, 380);
      }
      /* hide() público / tap-to-close: fuerza ocultar respetando MIN. */
      function hide(){
        if (hidden) return;
        var elapsed = Date.now() - startedAt;
        if (elapsed < MIN_MS) { setTimeout(hide, MIN_MS - elapsed); return; }
        doHide();
      }
      el.addEventListener('click', hide, { once:true });
      el.addEventListener('touchend', hide, { once:true });

      /* Trigger principal: DOMContentLoaded + GRACE (app usable, el
         bundle ya ejecutó). NO window.load — eso espera a TODOS los
         escudos y dispara decenas de segundos en móvil. */
      function _afterReady(){ setTimeout(hide, GRACE_MS); }
      if (document.readyState === 'interactive' || document.readyState === 'complete') { _afterReady(); }
      else { document.addEventListener('DOMContentLoaded', _afterReady, { once:true }); }

      /* Backstop absoluto: la web abre en ≤MAX_MS pase lo que pase. */
      setTimeout(doHide, MAX_MS);
      /* Hook por si un flujo crítico (ej. partido live restaurándose
         del wprev_state_v1) quiere ocultarlo antes via _bootSplashHide(). */
      window._bootSplashHide = hide;

      /* BFCache: si el navegador restaura la página desde la caché de
         historial (pageshow.persisted=true) mientras el splash aún está
         visible, lo cerramos de inmediato — el DOM ya está listo. */
      window.addEventListener('pageshow', function(e){ if(e.persisted) doHide(); });
    })();
  </script>

  <script>
  /* ── PARCHE INLINE: bloquea el overlay central de gol ──────────────────
     Corre inmediatamente después del bundle, sin depender de archivos
     externos cacheados. Es la última línea de defensa. */
  (function(){
    /* 1. Ocultar el elemento si ya existe */
    function hideOverlay(){
      var el=document.getElementById('mm-event-flash');
      if(!el)return;
      el.style.setProperty('display','none','important');
      el.style.setProperty('visibility','hidden','important');
      el.style.setProperty('opacity','0','important');
      el.classList.remove('show','mm-flash-gol','mm-flash-roja');
    }

    /* 2. Parchear window.mmShowFlash para goles */
    var _origFlash = window.mmShowFlash;
    window.mmShowFlash = function(type, teamName, playerName){
      if(type === 'gol'){
        /* Delegar al sistema mejorado si está disponible */
        if(window.goalNotificationImproved){
          /* Buscar el partido por nombre de equipo */
          var matches=document.querySelectorAll('[id^="mlw-"]');
          var matchId=null, team='a';
          for(var i=0;i<matches.length;i++){
            var names=matches[i].querySelectorAll('.ml-team-name');
            for(var j=0;j<names.length;j++){
              if(names[j].textContent.includes(teamName)){
                matchId=matches[i].id.replace('mlw-','');
                team=(j===1)?'b':'a';
                break;
              }
            }
            if(matchId)break;
          }
          if(matchId) window.goalNotificationImproved.show(matchId,team,playerName||'');
        }
        hideOverlay();
        return; /* NUNCA mostrar el overlay central */
      }
      /* Para otros tipos (roja) usar el comportamiento original */
      if(_origFlash) _origFlash(type,teamName,playerName);
    };

    /* 3. MutationObserver sobre el elemento para bloquear cualquier
          intento de mostrar el overlay (incluso si viene de código privado) */
    function watchOverlay(){
      var el=document.getElementById('mm-event-flash');
      if(!el||el._blocked)return;
      el._blocked=true;
      hideOverlay();
      new MutationObserver(function(){hideOverlay();})
        .observe(el,{attributes:true,attributeFilter:['class','style']});
    }
    /* Observar body para cuando el elemento se cree dinámicamente */
    new MutationObserver(function(ms){
      ms.forEach(function(m){
        m.addedNodes.forEach(function(n){
          if(n.id==='mm-event-flash'){hideOverlay();watchOverlay();}
        });
      });
      watchOverlay();
    }).observe(document.body,{childList:true});

    watchOverlay();
    setInterval(hideOverlay,150);
  })();
  </script>

    purgeGooool();
    new MutationObserver(purgeGooool).observe(document.body,{childList:true,subtree:true});
  })();
  </script>

  <script>
    document.addEventListener('DOMContentLoaded', function(){
      /* Agrupa cada back-btn con el icono de inicio */
      document.querySelectorAll('.back-btn').forEach(function(btn){
        if(btn.closest('.nav-row')) return;
        var row = document.createElement('div');
        row.className = 'nav-row';
        btn.parentNode.insertBefore(row, btn);
        row.appendChild(btn);
        /* IMPORTANTE: usar un <button> con go('s-home') en lugar de un
           <a href="/"> para evitar que el navegador recargue la página
           entera y destruya todo el estado JavaScript. Una recarga mata
           cualquier partido live en curso (gm-modal, amistosos, etc).
           Con go('s-home') mantenemos la SPA viva y los cronómetros
           siguen corriendo en segundo plano. */
        var homeBtn = document.createElement('button');
        homeBtn.type = 'button';
        homeBtn.className = 'home-icon-btn';
        homeBtn.setAttribute('aria-label', 'Ir al inicio');
        homeBtn.textContent = '🏠';
        homeBtn.addEventListener('click', function(ev){
          ev.preventDefault();
          ev.stopPropagation();
          if (typeof window.go === 'function') {
            try { window.go('s-home'); return; } catch(_){}
          }
          /* Último recurso: si go no está disponible, recarga la home
             SOLO si realmente no hay forma de navegar sin romper nada. */
          try { window.location.hash = '#/'; } catch(_){}
        });
        row.appendChild(homeBtn);
      });
      /* Nuclear override: fuerza 80px en TODOS los cards del home */
      var sels = [
        '#s-home .menu-card',
        '#s-home .equipo-card',
        '#s-home .mc-athletic',
        '#s-home .mc-betis',
        '#s-home .mc-sociedad',
        '#s-home .mc-madrid',
        '#s-home .mc-barca'
      ];
      var props = ['height','min-height','max-height'];
      sels.forEach(function(s){
        document.querySelectorAll(s).forEach(function(el){
          props.forEach(function(p){ el.style.setProperty(p,'80px','important'); });
          el.style.setProperty('overflow','hidden','important');
          el.style.setProperty('position','relative','important');
          el.style.setProperty('box-sizing','border-box','important');
        });
      });
    });

  <script>
  /* ════════════════════════════════════════════════════════════════
     AVISO DE BD EFÍMERA (2026-06-13) — petición usuario:
     «el resto de ligas da muchos dolores de cabeza, ahora salen ligas
     de países sin equipos y estaban absolutamente todos hechos».

     Causa raíz CONFIRMADA (/api/debug → backend "sqlite", EFÍMERA): en
     Railway sin plugin Postgres la SQLite del contenedor se BORRA en
     CADA deploy/restart → el servidor pierde TODOS los `liga_ext_*`.
     Cuando además el navegador del usuario tiene los datos borrados (o
     entra desde otro dispositivo), no hay de dónde recuperar y las
     ligas salen «sin equipos» aunque estuvieran todas hechas. NO es un
     bug de fusión (el anti-wipe funciona); es que no hay nada DURABLE
     debajo. Es exactamente la regla 9 de CLAUDE.md.

     No podemos arreglar la persistencia desde el código (es config de
     Railway). Lo que SÍ hacemos: convertir esta catástrofe SILENCIOSA
     en un aviso VISIBLE y accionable, para que el usuario sepa al
     instante que sus datos NO se están guardando y cómo arreglarlo de
     forma permanente. El aviso desaparece solo cuando la BD pasa a ser
     Postgres persistente (backend === "postgresql").
     ════════════════════════════════════════════════════════════════ */
  (function(){
    function showEphemeralBanner(info){
      try {
        if (document.getElementById('ephemeral-db-warning')) return;
        var nTeams = 0;
        try {
          (info.ligas_ext || []).forEach(function(l){ nTeams += (l && +l.teams) || 0; });
        } catch(_){}
        var nLigas = (info.counts && info.counts.liga_ext_rows) || 0;
        var bar = document.createElement('div');
        bar.id = 'ephemeral-db-warning';
        bar.style.cssText = [
          'position:fixed','top:0','left:0','right:0','z-index:99999',
          'background:linear-gradient(90deg,#7a0010,#cf142b,#7a0010)',
          'color:#fff','font-family:Oswald,Rajdhani,sans-serif',
          'padding:10px 44px 10px 14px','box-shadow:0 2px 12px rgba(0,0,0,.6)',
          'border-bottom:2px solid #ffd633','line-height:1.32','font-size:13px'
        ].join(';');
        bar.innerHTML =
          '<div style="max-width:760px;margin:0 auto;">'
          + '<b style="color:#ffd633;font-size:14px;">⚠️ ATENCIÓN: el servidor NO está guardando los datos de forma permanente.</b><br>'
          + 'La base de datos es <b>efímera (SQLite)</b>: en cada actualización de la app se BORRA todo lo del servidor '
          + '(por eso «Resto de Ligas» aparece sin equipos aunque los tuvieras todos hechos). '
          + 'Ahora mismo el servidor guarda <b>' + nLigas + '</b> ligas / <b>' + nTeams + '</b> equipos.<br>'
          + '<b style="color:#ffd633;">Arreglo permanente (2 min):</b> en Railway → tu proyecto → <b>+ New → Database → Add PostgreSQL</b>. '
          + 'Railway inyecta <code>DATABASE_URL</code> automáticamente y la app pasa a Postgres persistente al re-desplegar. '
          + '<b>Antes de hacerlo, exporta un backup</b> desde 🖍 Editar → 💾 (por si acaso).'
          + '</div>'
          + '<button id="ephemeral-db-warning-x" aria-label="Cerrar" style="position:absolute;top:6px;right:10px;'
          + 'background:transparent;border:none;color:#fff;font-size:20px;cursor:pointer;line-height:1;">✕</button>';
        document.body.appendChild(bar);
        /* Empujar el contenido hacia abajo para no tapar la cabecera. */
        try { document.body.style.paddingTop = (bar.offsetHeight + 4) + 'px'; } catch(_){}
        var x = document.getElementById('ephemeral-db-warning-x');
        if (x) x.addEventListener('click', function(){
          try { bar.remove(); document.body.style.paddingTop = ''; } catch(_){}
          /* Solo se oculta para ESTA sesión: vuelve a salir en el
             próximo arranque mientras la BD siga siendo efímera. */
          try { sessionStorage.setItem('ephemeralDbWarnDismissed', '1'); } catch(_){}
        });
      } catch(_){}
    }
    function checkDb(){
      try {
        var dismissed = false;
        try { dismissed = sessionStorage.getItem('ephemeralDbWarnDismissed') === '1'; } catch(_){}
        if (dismissed) return;
        fetch('/api/debug', { credentials:'same-origin' })
          .then(function(r){ return r.ok ? r.json() : null; })
          .then(function(j){
            if (!j) return;
            /* Solo avisamos si NO es Postgres persistente. */
            if (j.backend !== 'postgresql') showEphemeralBanner(j);
          })
          .catch(function(){});
      } catch(_){}
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function(){ setTimeout(checkDb, 800); });
    } else {
      setTimeout(checkDb, 800);
    }
  })();
  </script>
</body>
</html>
